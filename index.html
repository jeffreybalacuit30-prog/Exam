<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Dumaguete College - Ethics Exam</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:white;
    width:600px;
    max-width:95%;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1,h2{
    text-align:center;
    color:#4CAF50;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

.option{
    background:#f1f1f1;
    padding:12px;
    margin-top:10px;
    border-radius:5px;
    cursor:pointer;
}

.option:hover{
    background:#ddd;
}

.timer{
    text-align:center;
    font-size:20px;
    color:red;
}

.hidden{
    display:none;
}

.result{
    text-align:center;
}

</style>

</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>Metro Dumaguete College</h1>
<h2>Ethics Exam</h2>

<div id="info">

<h3>Student Information</h3>

<input id="name" placeholder="Full Name">
<input id="id" placeholder="Student ID">

<select id="year">
<option value="">Year Level</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<button onclick="startExam()">Start Exam</button>

</div>

<div id="exam" class="hidden">

<div class="timer">
Time Left: <span id="time">10</span>
</div>

<h3 id="question"></h3>

<div id="options"></div>

</div>

<div id="result" class="hidden result">

<h2>Exam Finished</h2>

<h3 id="score"></h3>

<button onclick="location.reload()">Restart</button>

</div>

</div>

<script>

function shuffle(array){

for(let i=array.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

}

let questions=[

{
question:"What is a human act?",
options:[
"A. An action done without thinking",
"B. An action done with knowledge freedom and consent",
"C. An action done while sleeping",
"D. An action done by animals"
],
correct:"B"
},

{
question:"Example of act of man?",
options:[
"A. Studying",
"B. Helping",
"C. Blinking eyes",
"D. Lying"
],
correct:"C"
},

{
question:"NOT determinant of morality?",
options:[
"A. Object",
"B. Intention",
"C. Circumstances",
"D. Appearance"
],
correct:"D"
},

{
question:"Accountability means?",
options:[
"A. Ignore actions",
"B. Answerable actions",
"C. Follow blindly",
"D. Avoid responsibility"
],
correct:"B"
},

{
question:"NOT basis accountability?",
options:[
"A. Knowledge",
"B. Freedom",
"C. Voluntariness",
"D. Strength"
],
correct:"D"
},

{
question:"Modify accountability?",
options:[
"A. Fear",
"B. Ignorance",
"C. Passion",
"D. All above"
],
correct:"D"
},

{
question:"Emotions affect decision?",
options:[
"A. Faster decision",
"B. Prevent decision",
"C. Remove responsibility",
"D. Illegal decision"
],
correct:"A"
},

{
question:"Minimum morality requirement?",
options:[
"A. Knowledge strength",
"B. Reason impartiality",
"C. Emotion power",
"D. Fear punishment"
],
correct:"B"
},

{
question:"Reason helps?",
options:[
"A. Avoid thinking",
"B. Emotional only",
"C. Use logic",
"D. Ignore facts"
],
correct:"C"
},

{
question:"Will is?",
options:[
"A. Sleep",
"B. Forget",
"C. Decide choose",
"D. Feel emotion"
],
correct:"C"
}

];

shuffle(questions);

questions.forEach(q=>shuffle(q.options));

let index=0;
let score=0;
let timer;
let time=10;

function startExam(){

let name=document.getElementById("name").value;

if(name==""){

alert("Enter name");

return;

}

document.getElementById("info").classList.add("hidden");

document.getElementById("exam").classList.remove("hidden");

showQuestion();

startTimer();

}

function showQuestion(){

if(index>=questions.length){

finish();

return;

}

let q=questions[index];

document.getElementById("question").innerText=(index+1)+". "+q.question;

let optionsDiv=document.getElementById("options");

optionsDiv.innerHTML="";

q.options.forEach(opt=>{

let div=document.createElement("div");

div.className="option";

div.innerText=opt;

div.onclick=function(){

answer(opt.charAt(0));

};

optionsDiv.appendChild(div);

});

}

function answer(ans){

if(ans==questions[index].correct){

score++;

}

index++;

time=10;

showQuestion();

}

function startTimer(){

timer=setInterval(()=>{

time--;

document.getElementById("time").innerText=time;

if(time==0){

index++;

time=10;

showQuestion();

}

},1000);

}

function finish(){

clearInterval(timer);

document.getElementById("exam").classList.add("hidden");

document.getElementById("result").classList.remove("hidden");

document.getElementById("score").innerText=

"Score: "+score+" / "+questions.length;

}

</script>

</body>
</html>
